# CI — roda em toda pull request pra main. Mostra o que o Terraform mudaria (plan, sem aplicar
# nada). Não faz deploy de verdade — isso é o cd.yml, pós-merge.

name: CI

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    # Mesmo motivo do cd.yml: o bucket não é gerenciado pelo Terraform, e o `terraform init`
    # exige que ele já exista. Numa conta nova, a primeira PR rodaria antes de qualquer CD ter
    # criado o bucket — este passo garante que o plan não falhe por isso.
    - name: Garantir que o bucket do backend existe (idempotente)
      run: |
        aws s3api head-bucket --bucket fiap-mecanica --region ${{ env.AWS_REGION }} 2>/dev/null || \
        aws s3api create-bucket --bucket fiap-mecanica --region ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init
      run: terraform init
    - name: Terraform plan
      run: terraform plan
